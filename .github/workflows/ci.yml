name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Branch of walmartlabs/concord to build and install before ck8s-java. Concord snapshots are
  # published nowhere, so a -SNAPSHOT concord.version only resolves once it is built here. Clear
  # this once concord.version points at a release, and concord comes from the release repositories.
  concordRef: brig/versions-up

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # concord's enforcer wants [25,); ck8s-java wants [21,) and both compile to release 21
          java-version: 25
          cache: maven

      - name: Checkout concord
        if: env.concordRef != ''
        uses: actions/checkout@v4
        with:
          repository: walmartlabs/concord
          ref: ${{ env.concordRef }}
          path: .concord

      # only the modules ck8s-java resolves concord artifacts from, and -am for the rest of the
      # reactor they need — building all of concord also builds its integration tests and images
      - name: Install concord
        if: env.concordRef != ''
        working-directory: .concord
        run: ./mvnw -B install -DskipTests -am -pl agent,client2,common,config,imports,it/testing-server,repository,sdk,targetplatform,plugins/tasks/concord,plugins/tasks/crypto,plugins/tasks/lock,runtime/common,runtime/model,runtime/v2/model,runtime/v2/runner,runtime/v2/sdk,runtime/v2/vm,server/db,server/dist,server/impl,server/sdk,server/plugins/ansible/impl,server/plugins/noderoster/impl,server/plugins/oneops

      - name: Build
        run: ./mvnw -B clean install
